[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shortleash"
# Single source of truth: shortleash/__init__.py defines __version__.
dynamic = ["version"]
description = "Circuit breaker for AI coding-agent runs: wraps a command, enforces budget/spawn/token/time caps live, kills on breach."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Calas Automations Inc."}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude-code", "agents", "budget", "circuit-breaker", "guardrails", "subprocess"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/shortleash"
Issues = "https://github.com/calasdan-sketch/shortleash/issues"
Changelog = "https://github.com/calasdan-sketch/shortleash/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "shortleash.__version__"}

[tool.setuptools]
# Explicit: the flat layout also holds sim/ and tests/, which setuptools'
# auto-discovery otherwise refuses ("Multiple top-level packages").
packages = ["shortleash"]

[project.scripts]
shortleash = "shortleash.cli:main"

[tool.setuptools.package-data]
shortleash = ["py.typed"]
